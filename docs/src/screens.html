<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#0e1621;font-family:"Noto Sans",sans-serif}
  .page{width:1000px;padding:28px 32px 36px;box-sizing:border-box}
  .bar{display:flex;align-items:center;gap:12px;color:#e7edf5;font-weight:700;font-size:19px;margin-bottom:6px}
  .bar .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#b46cff);display:grid;place-items:center}
  .bar small{display:block;font-weight:400;color:#7f91a4;font-size:13px}
  .note{color:#6f8195;font-size:12.5px;margin:0 0 18px 50px}
  .msg{max-width:720px;margin:10px 0;padding:11px 15px;border-radius:16px;font-size:16.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .bot{background:#182533;color:#e7edf5;border-top-left-radius:6px}
  .me{background:#2b5278;color:#fff;margin-left:auto;border-top-right-radius:6px;font-family:"Fira Code",monospace;font-size:15px}
  .bot .t{font-size:12px;color:#6f8195;margin-top:4px;text-align:right}
  .clip{display:block;margin-top:8px;border-radius:12px;width:420px}
  .play{position:relative;display:inline-block}
  .play:after{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);font-size:42px;color:#fff;
    background:#0008;border-radius:50%;width:74px;height:74px;display:grid;place-items:center}
</style></head><body><div class="page" id="p"></div>
<script id="data" type="application/json">{}</script>
<script>
  const d = JSON.parse(document.getElementById('data').textContent);
  const p = document.getElementById('p');
  p.innerHTML = `<div class="bar"><div class="av">☤</div><div>${d.title||'Hermes'}<small>${d.subtitle||''}</small></div></div>
    <div class="note">${d.note||''}</div>`;
  for (const m of d.messages||[]) {
    const el = document.createElement('div');
    el.className = 'msg ' + (m.me ? 'me' : 'bot');
    el.textContent = m.text;
    if (m.img) { const w=document.createElement('span'); w.className='play'; const i=document.createElement('img');
      i.src=m.img; i.className='clip'; w.appendChild(i); el.appendChild(document.createElement('br')); el.appendChild(w); }
    if (m.time && !m.me) { const t=document.createElement('div'); t.className='t'; t.textContent=m.time; el.appendChild(t); }
    p.appendChild(el);
  }
</script></body></html>
